name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Compile · Test · Build APK
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          install: |
            platforms;android-34
            build-tools;34.0.0

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compilation check
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Decode signing keystore (if secret is set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore.jks
            echo "Keystore written"
          else
            echo "No keystore secret — release APK will be unsigned"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated build of Phaze.

            - `app-debug.apk` — debug build (installable)
            - `app-release.apk` — release build (signed when signing secrets are set, otherwise unsigned)
          files: |
            apks/**/*.apk
          draft: false
          prerelease: false
